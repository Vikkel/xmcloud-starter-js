        <div class="ck-content"><h1>L'importanza della pressione di pre-compressione e del tempo di permanenza per mitigare i problemi di <span style="color:hsl(240, 75%, 60%);"><strong>capping delle compresse</strong></span>.</h1><h2><br />Risolvere i problemi di <span style="color:hsl(240, 75%, 60%);"><strong>capping delle compresse</strong></span><br />Il capping è un termine usato per descrivere il distacco di un frammento trasversale dalla faccia della compressa, che di solito si verifica subito dopo l'espulsione della compressa dalla matrice. Il danneggiamento delle compresse dovuto al capping porterà invariabilmente al rigetto del lotto di produzione. Per un prodotto registrato, modificare la formulazione non è l'opzione preferita per risolvere tali problemi. Inoltre, per un prodotto ad alto dosaggio, esistono limiti alle modifiche della formulazione e la soluzione finale potrebbe non risolvere completamente il problema del capping.</h2><p>&nbsp;</p><p>Una possibile alternativa per migliorare il capping consiste nell'utilizzare una pressa rotativa per compresse appositamente progettata che impiega un compensatore ad aria nella fase di pre-compressione: la forza di pre-compressione, insieme a un tempo di permanenza esteso, può essere modificata prima dell'evento di compressione principale. Questa nuova modalità di applicazione della forza di pre-compressione è stata studiata utilizzando una pressa rotativa per compresse GEA con compensatore ad aria su granuli preparati mediante granulazione ad alta velocità di taglio; la formulazione comprendeva il 78% di acetaminofene (p/p) e il 22% di amido (p/p). È stato riscontrato che la modifica della modalità di applicazione della forza di compressione è in grado di ridurre o addirittura eliminare il verificarsi del capping delle compresse senza compromettere la resistenza meccanica delle compresse prodotte.</p><p>&nbsp;</p><h2>Metodi<br />I granuli di acetaminofene-amido sono stati miscelati a secco con l'1,1% di stearato di magnesio (p/p) e lo 0,16% di biossido di silicio colloidale (p/p). Per preparare compresse piatte smussate da 325 mg è stata utilizzata una pressa per compresse GEA (R190FT) con punzoni da 10 mm. Sono stati studiati diversi parametri di compressione delle compresse, tra cui pressione di pre-compressione, spessore della compressa in pre-compressione, spessore della compressa in compressione principale e velocità della torretta.</h2><p>&nbsp;</p><p>Per ogni lotto di compresse prodotto sono stati registrati i valori di pressione di compressione principale, tempo di permanenza e spostamento. I lotti con meno del 10% di capping delle compresse dopo la compressione sono stati ulteriormente caratterizzati secondo i metodi della Farmacopea USP per lo spessore della compressa (Digimatic Micrometer, Mitotuyo, Giappone), la resistenza alla rottura (HT1, Sotax, Svizzera) e la friabilità (TA20, Erweka, Germania). È stato registrato anche il numero di compresse che presentavano capping dopo il test di friabilità.</p><p>&nbsp;</p><h2>Risultati e discussione<br />La produzione di compresse a partire dai granuli richiede l'applicazione di una certa quantità di forza o pressione di compressione. Una pressione di compressione insufficiente comporterà il mancato consolidamento dei granuli in masse coerenti o compresse in grado di resistere a ulteriori manipolazioni o lavorazioni. Tuttavia, una pressione di compressione eccessiva può provocare capping o compresse eccessivamente dure che mostrerebbero tempi di disintegrazione indebitamente prolungati. Per la formulazione acetaminofene-amido, è stato riscontrato che la produzione di compresse richiedeva una pressione di compressione principale nell'intervallo 108–140 N/mm2. Le compresse prodotte con una pressione di compressione principale superiore a 140 N/mm2 hanno mostrato capping immediatamente dopo la compressione. Al contrario, l'uso di una bassa pressione di compressione principale (&lt;100 N/mm2) ha prodotto compresse con una resistenza alla rottura molto bassa (&lt;25 N).</h2><p>&nbsp;</p><p>Per ciascuna pressione di compressione principale selezionata nell'intervallo 108–140 N/mm2, la resistenza alla rottura della compressa aumentava mentre la friabilità della compressa e l'incidenza del capping diminuivano con l'aumento della pressione di pre-compressione. Utilizzando un limite di pressione di pre-compressione di 34 N/mm2 e una pressione di compressione principale di 108 N/mm2, il tempo di permanenza poteva essere modificato regolando lo spessore della compressa in pre-compressione e la velocità della torretta. Il compensatore ad aria sul rullo di pre-compressione si spostava verso l'alto se la forza di pre-compressione superava la forza limite preimpostata, mantenendo così costante la pressione di pre-compressione sulla compressa mentre il tempo di permanenza aumentava di conseguenza.</p><p>&nbsp;</p><p>Aumentando il tempo di permanenza nella fase di pre-compressione, è stato riscontrato un aumento della resistenza alla rottura delle compresse e una diminuzione della friabilità. La deformazione plastica e la frammentazione fragile sono state riportate come meccanismi di deformazione per l'acetaminofene.1,2 Un aumento del tempo di permanenza ha esteso il tempo di contatto effettivo durante il quale il compatto era soggetto a una forza applicata in grado di causare capping, consentendo un'ulteriore deformazione plastica. Ciò ha determinato un aumento dei tempi di legame particella-particella. La successiva applicazione della pressione di compressione principale ha ulteriormente migliorato l'interazione e aumentato la resistenza meccanica delle compresse risultanti.</p><p>&nbsp;</p><p>Tuttavia, senza un intervento appropriato nella fase di pre-compressione che consenta il consolidamento iniziale della compressa, l'applicazione di un'elevata pressione di compressione principale potrebbe causare una possibile rottura dei legami formati correlata al recupero elastico, creando così aree indebolite nelle compresse e predisponendole al capping.</p></div>
