      Hint: Content
      Value: |
        <div class="ck-content"><p>GEA offers a range of <span style="color:hsl(240, 75%, 60%);"><strong>curd cutter</strong></span> models, which are designed to the highest specifications and hygiene standards. Options include the provision of sprinkler valves throughout the chamber and associated pipework for connecting to an external cleaning-in-place plant. It is also possible to configure some models units with safety sensors that automatically stop operation if inspection panels to the cutter are opened. And of course, all GEA technologies are designed to be service friendly, and are built using the highest quality materials and components to maximize lifespan.</p></div>
