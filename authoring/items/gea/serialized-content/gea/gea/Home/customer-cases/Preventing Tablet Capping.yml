        <div class="ck-content"><h1>La importancia de la presión de precompresión y del tiempo de permanencia para mitigar los problemas de <span style="color:hsl(240, 75%, 60%);"><strong>capping en tabletas</strong></span>.</h1><h2><br />Solución de los problemas de <span style="color:hsl(240, 75%, 60%);"><strong>capping en tabletas</strong></span><br />Capping es un término que se utiliza para describir el desprendimiento de un fragmento transversal de la cara de la tableta, que suele producirse justo después de la eyección de la tableta de la matriz. El daño en las tabletas por capping conduce invariablemente al rechazo del lote de producción. En el caso de un producto registrado, cambiar la formulación no es la opción preferida para resolver estos problemas. Además, para un producto de alta dosis, existen límites a los cambios de formulación y es posible que la solución final no resuelva por completo el problema de capping.</h2><p>&nbsp;</p><p>Una posible alternativa para mejorar el capping es utilizar una tableteadora rotativa de diseño especial que emplea un compensador de aire en la etapa de precompresión: la fuerza de precompresión, junto con un tiempo de permanencia prolongado, puede modificarse antes del evento principal de compresión. Este novedoso modo de aplicación de la fuerza de precompresión se investigó utilizando una tableteadora rotativa de GEA con compensador de aire sobre gránulos preparados mediante granulación de alta cizalla; la formulación estaba compuesta por 78% de acetaminofén (w/w) y 22% de almidón (w/w). Se observó que la modificación del modo de aplicación de la fuerza de compresión era capaz de reducir o incluso eliminar la aparición de capping en tabletas sin comprometer la resistencia mecánica de las tabletas producidas.</p><p>&nbsp;</p><h2>Métodos<br />Los gránulos de acetaminofén y almidón se mezclaron en seco con 1.1% de estearato de magnesio (w/w) y 0.16% de dióxido de silicio coloidal (w/w). Se utilizó una tableteadora GEA (R190FT) con punzones de 10 mm para preparar tabletas planas biseladas de 325 mg. Se investigaron varios parámetros de tableteado, entre ellos la presión de precompresión, el espesor de la tableta en precompresión, el espesor de la tableta en compresión principal y la velocidad de la torreta.</h2><p>&nbsp;</p><p>Se registraron los valores de presión de compresión principal, tiempo de permanencia y desplazamiento para cada lote de tabletas producido. Los lotes con menos de 10% de capping en tabletas después de la compresión se caracterizaron adicionalmente de acuerdo con los métodos de la Farmacopea USP para espesor de tableta (Digimatic Micrometer, Mitotuyo, Japón), resistencia a la rotura (HT1, Sotax, Suiza) y friabilidad (TA20, Erweka, Alemania). También se registró el número de tabletas con capping después del ensayo de friabilidad.</p><p>&nbsp;</p><h2>Resultados y análisis<br />La producción de tabletas a partir de gránulos requiere la aplicación de una determinada cantidad de fuerza o presión de compresión. Una presión de compresión insuficiente provocará que los gránulos no se consoliden en masas coherentes o tabletas que puedan soportar su manipulación o procesamiento posterior. Sin embargo, una presión de compresión excesiva puede provocar capping o tabletas excesivamente duras que mostrarían tiempos de desintegración indebidamente prolongados. Para la formulación de acetaminofén y almidón, se observó que la producción de tabletas requería que la presión de compresión principal estuviera en el intervalo de 108–140 N/mm2. Las tabletas producidas con una presión de compresión principal superior a 140 N/mm2 presentaron capping inmediatamente después de la compresión. En cambio, el uso de una presión de compresión principal baja (&lt;100 N/mm2) produjo tabletas con una resistencia a la rotura muy baja (&lt;25 N).</h2><p>&nbsp;</p><p>Para cada presión de compresión principal seleccionada dentro del intervalo de 108–140 N/mm2, la resistencia a la rotura de las tabletas aumentó, mientras que la friabilidad y la aparición de capping disminuyeron con el aumento de la presión de precompresión. Utilizando un límite de presión de precompresión de 34 N/mm2 y una presión de compresión principal de 108 N/mm2, el tiempo de permanencia podía modificarse ajustando el espesor de la tableta en precompresión y la velocidad de la torreta. El compensador de aire en el rodillo de precompresión desplazaba el rodillo hacia arriba si la fuerza de precompresión superaba la fuerza límite preajustada, manteniendo así constante la presión de precompresión sobre la tableta, mientras que el tiempo de permanencia aumentaba en consecuencia.</p><p>&nbsp;</p><p>Al aumentar el tiempo de permanencia en la etapa de precompresión, se observó que la resistencia a la rotura de las tabletas aumentaba y la friabilidad disminuía. Se ha informado de que la deformación plástica y la fragmentación frágil son mecanismos de deformación del acetaminofén.1,2 Un aumento del tiempo de permanencia prolongó el tiempo de contacto efectivo durante el cual el compacto estuvo sometido a una fuerza aplicada capaz de provocar capping, lo que permitió una mayor deformación plástica. Esto se tradujo en un aumento de los tiempos de unión partícula-partícula. La aplicación posterior de la presión de compresión principal mejoró aún más la interacción y la resistencia mecánica de las tabletas resultantes.</p><p>&nbsp;</p><p>Sin embargo, sin la intervención adecuada en la etapa de precompresión para permitir la consolidación inicial de la tableta, la aplicación de una presión de compresión principal elevada podría provocar una posible rotura de los enlaces relacionada con la recuperación elástica, creando así zonas debilitadas en las tabletas y haciéndolas más propensas al capping.</p></div>
