        <div class="ck-content"><h1>Het belang van voordruk en verblijftijd om <span style="color:hsl(240, 75%, 60%);"><strong>tablet capping</strong></span>-problemen te beperken.</h1><h2><br />Oplossen van problemen met <span style="color:hsl(240, 75%, 60%);"><strong>tablet capping</strong></span><br />Capping is een term die wordt gebruikt om het loskomen van een dwarsdoorsnededeel van het tabletoppervlak te beschrijven, wat meestal optreedt vlak nadat de tablet uit de matrijs is uitgeworpen. Schade aan tabletten door capping leidt onvermijdelijk tot afkeuring van de productiebatch. Bij een geregistreerd product is het wijzigen van de formulering niet de voorkeursoptie om dergelijke problemen op te lossen. Bovendien zijn er bij een hooggedoseerd product grenzen aan wijzigingen in de formulering en biedt de uiteindelijke oplossing mogelijk geen volledige oplossing voor het capping-probleem.</h2><p>&nbsp;</p><p>Een mogelijk alternatief om capping te verminderen is het gebruik van een speciaal ontworpen roterende tabletpers die in de voordrukfase een luchtcompensator gebruikt: de voordrukkracht kan, in combinatie met een verlengde verblijftijd, worden aangepast vóór de hoofdcompressiefase. Deze nieuwe manier van het toepassen van voordrukkracht werd onderzocht met een GEA roterende tabletpers met luchtcompensator op granulaat dat was bereid via high shear granulation; de formulering bestond uit 78% acetaminophen (w/w) en 22% starch (w/w). Er werd vastgesteld dat aanpassing van de manier waarop de compressiekracht werd toegepast de kans op tablet capping kon verminderen of zelfs elimineren, zonder de mechanische sterkte van de geproduceerde tabletten in gevaar te brengen.</p><p>&nbsp;</p><h2>Methoden<br />Acetaminophen-starchgranulaat werd droog gemengd met 1.1% magnesiumstearaat (w/w) en 0.16% colloïdaal siliciumdioxide (w/w). Een GEA tabletpers (R190FT) met 10 mm stempels werd gebruikt om platte, afgeschuinde tabletten van 325 mg te maken. Verschillende tableteerparameters werden onderzocht, waaronder voordruk, tablet­dikte bij voordruk, tabletdikte bij hoofdcompressie en omloopsnelheid.</h2><p>&nbsp;</p><p>Hoofdcompressiedruk, verblijftijd en verplaatsingswaarden werden geregistreerd voor elke geproduceerde batch tabletten. Batches met minder dan 10% tablet capping na compressie werden vervolgens verder gekarakteriseerd volgens de USP Pharmacopoeia-methoden voor tabletdikte (Digimatic Micrometer, Mitotuyo, Japan), breuksterkte (HT1, Sotax, Switzerland) en brosheid (TA20, Erweka, Germany). Ook het aantal tabletten met capping na de brosheidstest werd geregistreerd.</p><p>&nbsp;</p><h2>Resultaten en discussie<br />Voor de productie van tabletten uit granulaat is de toepassing van een bepaalde mate van compressiekracht of druk vereist. Onvoldoende compressiedruk leidt ertoe dat het granulaat niet consolideert tot samenhangende massa's of tabletten die verdere hantering of verwerking kunnen weerstaan. Overmatige compressiedruk kan echter leiden tot capping of tot te harde tabletten met ongewenst lange desintegratietijden. Voor de acetaminophen-starchformulering werd vastgesteld dat voor tabletproductie een hoofdcompressiedruk in het bereik van 108–140 N/mm2 nodig was. Tabletten die werden geproduceerd met een hoofdcompressiedruk hoger dan 140 N/mm2 vertoonden direct na compressie capping. Daarentegen leverde gebruik van een lage hoofdcompressiedruk (&lt;100 N/mm2) tabletten op met een zeer lage breuksterkte (&lt;25 N).</h2><p>&nbsp;</p><p>Voor elke geselecteerde hoofdcompressiedruk binnen het bereik van 108–140 N/mm2 nam de breuksterkte van de tabletten toe, terwijl de brosheid en het optreden van capping afnamen naarmate de voordruk toenam. Met een voordruklimiet van 34 N/mm2 en een hoofdcompressiedruk van 108 N/mm2 kon de verblijftijd worden aangepast door de tabletdikte bij voordruk en de omloopsnelheid te wijzigen. De luchtcompensator bij de voordrukrol zou de rol omhoog bewegen als de voordrukkracht de vooraf ingestelde begrenzingskracht overschreed, waardoor de voordruk op de tablet constant bleef terwijl de verblijftijd overeenkomstig toenam.</p><p>&nbsp;</p><p>Door de verblijftijd in de voordrukfase te verlengen, nam de breuksterkte van de tabletten toe en nam de brosheid af. Plastic deformation en brittle fragmentation zijn gerapporteerd als vervormingsmechanismen voor acetaminophen.1,2 Een toename van de verblijftijd verlengde de effectieve contacttijd waarin de compacte massa werd blootgesteld aan een aangelegde kracht die capping kon veroorzaken, wat verdere plastische vervorming mogelijk maakte. Dit resulteerde in langere bindingstijden tussen deeltjes. De daaropvolgende toepassing van de hoofdcompressiedruk versterkte de interactie verder en verbeterde de mechanische sterkte van de resulterende tabletten.</p><p>&nbsp;</p><p>Maar zonder de juiste interventie in de voordrukfase om initiële consolidatie van de tablet mogelijk te maken, kan de toepassing van een hoge hoofdcompressiedruk mogelijk elastisch herstel en gerelateerde breuk van gevormde bindingen veroorzaken, waardoor verzwakte zones in de tabletten ontstaan en de kans op capping toeneemt.</p></div>
