        <div class="ck-content"><h1>L’importance de la pression de précompression et du temps de séjour pour atténuer les problèmes de <span style="color:hsl(240, 75%, 60%);"><strong>décalottage</strong></span> des comprimés.</h1><h2><br />Résoudre les problèmes de <span style="color:hsl(240, 75%, 60%);"><strong>décalottage</strong></span> des comprimés<br />Le décalottage est un terme utilisé pour décrire le détachement d’un fragment transversal de la face du comprimé, qui se produit généralement juste après l’éjection du comprimé hors de la matrice. Les dommages causés aux comprimés par le décalottage conduisent invariablement au rejet du lot de production. Pour un produit enregistré, modifier la formulation n’est pas l’option privilégiée pour résoudre ces problèmes. De plus, pour un produit fortement dosé, les possibilités de modification de la formulation sont limitées et la solution finale peut ne pas résoudre complètement le problème de décalottage.</h2><p>&nbsp;</p><p>Une autre solution possible pour améliorer le problème de décalottage consiste à utiliser une presse rotative à comprimés spécialement conçue, qui emploie un compensateur pneumatique à l’étape de précompression : la force de précompression, associée à un temps de séjour prolongé, peut être modifiée avant l’étape de compression principale. Ce nouveau mode d’application de la force de précompression a été étudié à l’aide d’une presse rotative à comprimés GEA avec compensateur pneumatique sur des granulés préparés par granulation à haut cisaillement ; la formulation comprenait 78% d’acétaminophène (p/p) et 22% d’amidon (p/p). Il a été constaté que la modification du mode d’application de la force de compression pouvait réduire, voire éliminer, l’apparition du décalottage des comprimés sans compromettre la résistance mécanique des comprimés produits.</p><p>&nbsp;</p><h2>Méthodes<br />Des granulés d’acétaminophène-amidon ont été mélangés à sec avec 1,1% de stéarate de magnésium (p/p) et 0,16% de diox