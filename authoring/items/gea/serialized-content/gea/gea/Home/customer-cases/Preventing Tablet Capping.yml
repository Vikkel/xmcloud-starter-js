        <div class="ck-content"><h1>Znaczenie ciśnienia wstępnego prasowania i czasu przebywania w ograniczaniu problemów <span style="color:hsl(240, 75%, 60%);"><strong>cappingu tabletek</strong></span>.</h1><h2><br />Rozwiązywanie problemów <span style="color:hsl(240, 75%, 60%);"><strong>cappingu tabletek</strong></span><br />Capping to termin używany do opisania oddzielenia fragmentu przekroju poprzecznego od powierzchni tabletki, które zwykle występuje tuż po wypchnięciu tabletki z matrycy. Uszkodzenie tabletek przez capping niezmiennie prowadzi do odrzucenia partii produkcyjnej. W przypadku zarejestrowanego produktu zmiana formulacji nie jest preferowaną opcją rozwiązania takich problemów. Ponadto w przypadku produktu wysokodawkowego istnieją ograniczenia dotyczące zmian formulacji, a ostateczne rozwiązanie może nie usunąć w pełni problemu cappingu.</h2><p>&nbsp;</p><p>Możliwą alternatywą ograniczenia cappingu jest zastosowanie specjalnie zaprojektowanej rotacyjnej prasy tabletkowej, która wykorzystuje kompensator powietrzny na etapie prasowania wstępnego: siłę prasowania wstępnego, w połączeniu z wydłużonym czasem przebywania, można modyfikować przed głównym etapem prasowania. Ten nowy tryb przyłożenia siły prasowania wstępnego zbadano z użyciem rotacyjnej prasy tabletkowej GEA z kompensatorem powietrznym na granulkach przygotowanych metodą granulacji szybkoobrotowej; formulacja zawierała 78% acetaminofenu (w/w) i 22% skrobi (w/w). Stwierdzono, że modyfikacja sposobu przyłożenia siły prasowania może ograniczyć, a nawet wyeliminować występowanie cappingu tabletek bez pogorszenia wytrzymałości mechanicznej wytwarzanych tabletek.</p><p>&nbsp;</p><h2>Metody<br />Granulki acetaminofen-skrobia mieszano na sucho z 1.1% stearynianu magnezu (w/w) i 0.16% koloidalnego dwutlenku krzemu (w/w). Do przygotowania płaskich tabletek ze ściętymi krawędziami o masie 325 mg użyto prasy tabletkowej GEA (R190FT) z punconami 10 mm. Badano różne parametry tabletkowania, w tym ciśnienie prasowania wstępnego, grubość tabletki po prasowaniu wstępnym, grubość tabletki po prasowaniu głównym oraz prędkość obrotową wieży.</h2><p>&nbsp;</p><p>Dla każdej wytworzonej partii tabletek rejestrowano wartości ciśnienia prasowania głównego, czasu przebywania i przemieszczenia. Partie, w których po prasowaniu odsetek tabletek z cappingiem był mniejszy niż 10%, poddano dalszej charakterystyce zgodnie z metodami Farmakopei USP dla grubości tabletki (Digimatic Micrometer, Mitotuyo, Japonia), wytrzymałości na zgniatanie (HT1, Sotax, Szwajcaria) i ścieralności (TA20, Erweka, Niemcy). Rejestrowano również liczbę tabletek, w których wystąpił capping po badaniu ścieralności.</p><p>&nbsp;</p><h2>Wyniki i dyskusja<br />Wytwarzanie tabletek z granulek wymaga przyłożenia określonej siły lub ciśnienia prasowania. Niewystarczające ciśnienie prasowania spowoduje, że granulki nie skonsolidują się w spójne masy lub tabletki, które mogłyby wytrzymać dalsze przenoszenie lub przetwarzanie. Jednak nadmierne ciśnienie prasowania może powodować capping albo nadmiernie twarde tabletki, które będą wykazywać niepożądanie wydłużony czas rozpadu. Dla formulacji acetaminofen-skrobia stwierdzono, że wytwarzanie tabletek wymagało, aby ciśnienie prasowania głównego mieściło się w zakresie 108–140 N/mm2. Tabletki wytwarzane przy ciśnieniu prasowania głównego wyższym niż 140 N/mm2 ulegały cappingowi natychmiast po sprasowaniu. Natomiast zastosowanie niskiego ciśnienia prasowania głównego (&lt;100 N/mm2) skutkowało tabletkami o bardzo niskiej wytrzymałości na zgniatanie (&lt;25 N).</h2><p>&nbsp;</p><p>Dla każdego wybranego ciśnienia prasowania głównego w zakresie 108–140 N/mm2 wytrzymałość tabletek na zgniatanie rosła, natomiast ścieralność i częstość występowania cappingu malały wraz ze wzrostem ciśnienia prasowania wstępnego. Przy zastosowaniu granicznego ciśnienia prasowania wstępnego 34 N/mm2 i ciśnienia prasowania głównego 108 N/mm2 czas przebywania można było zmieniać przez regulację grubości tabletki po prasowaniu wstępnym i prędkości obrotowej wieży. Kompensator powietrzny przy rolce prasowania wstępnego przesuwał rolkę ku górze, jeśli siła prasowania wstępnego przekraczała ustawioną wcześniej wartość graniczną, utrzymując w ten sposób stałe ciśnienie prasowania wstępnego na tabletce, podczas gdy czas przebywania odpowiednio się wydłużał.</p><p>&nbsp;</p><p>Stwierdzono, że zwiększenie czasu przebywania na etapie prasowania wstępnego zwiększa wytrzymałość tabletek na zgniatanie i zmniejsza ścieralność. Odkształcenie plastyczne i krucha fragmentacja były opisywane jako mechanizmy odkształcenia dla acetaminofenu.1,2 Wydłużenie czasu przebywania zwiększało efektywny czas kontaktu, przez jaki zwarta masa była poddawana przyłożonej sile mogącej powodować capping, co umożliwiało dalsze odkształcenie plastyczne. Prowadziło to do wydłużenia czasu tworzenia wiązań między cząstkami. Późniejsze przyłożenie ciśnienia prasowania głównego dodatkowo wzmacniało te oddziaływania i poprawiało wytrzymałość mechaniczną otrzymanych tabletek.</p><p>&nbsp;</p><p>Jednak bez odpowiedniej interwencji na etapie prasowania wstępnego, która umożliwia początkową konsolidację tabletki, zastosowanie wysokiego ciśnienia prasowania głównego może powodować możliwe rozerwanie utworzonych wiązań związane ze sprężystym odprężeniem, tworząc tym samym osłabione obszary w tabletkach i zwiększając ich podatność na capping.</p></div>
