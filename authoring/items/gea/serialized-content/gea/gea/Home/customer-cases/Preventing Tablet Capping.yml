        <div class="ck-content"><h1>Die Bedeutung von Vorkompressionsdruck und Verweilzeit zur Verringerung von <span style="color:hsl(240, 75%, 60%);"><strong>Tablettenkappenbildung</strong></span>.</h1><h2><br />Lösung von Problemen mit <span style="color:hsl(240, 75%, 60%);"><strong>Tablettenkappenbildung</strong></span><br />Capping ist ein Begriff zur Beschreibung der Ablösung eines querschnittlichen Fragments von der Tablettenoberfläche, die in der Regel direkt nach dem Ausstoßen der Tablette aus der Matrize auftritt. Die Beschädigung von Tabletten durch Capping führt unweigerlich zur Zurückweisung der Produktionscharge. Bei einem zugelassenen Produkt ist eine Änderung der Formulierung nicht die bevorzugte Option zur Behebung solcher Probleme. Darüber hinaus gibt es bei einem hoch dosierten Produkt Grenzen für Formulierungsänderungen, und die endgültige Lösung behebt das Capping-Problem möglicherweise nicht vollständig.</h2><p>&nbsp;</p><p>Eine mögliche Alternative zur Verringerung von Capping ist die Verwendung einer speziell entwickelten Rundläufer-Tablettenpresse, die in der Vorkompressionsstufe einen Luftkompensator einsetzt: Die Vorkompressionskraft kann in Verbindung mit einer verlängerten Verweilzeit vor dem eigentlichen Hauptkompressionsereignis angepasst werden. Dieser neuartige Modus der Anwendung der Vorkompressionskraft wurde mit einer GEA Rundläufer-Tablettenpresse mit Luftkompensator an Granulat untersucht, das durch High-Shear-Granulation hergestellt wurde; die Formulierung bestand aus 78% Acetaminophen (w/w) und 22% Stärke (w/w). Es wurde festgestellt, dass die Änderung der Art der Anwendung der Kompressionskraft das Auftreten von Tablettenkappenbildung verringern oder sogar beseitigen kann, ohne die mechanische Festigkeit der hergestellten Tabletten zu beeinträchtigen.</p><p>&nbsp;</p><h2>Methoden<br />Acetaminophen-Stärke-Granulat wurde trocken mit 1.1% Magnesiumstearat (w/w) und 0.16% kolloidalem Siliciumdioxid (w/w) gemischt. Eine GEA Tablettenpresse (R190FT) mit 10 mm Stempeln wurde zur Herstellung von 325 mg schweren flachen, abgeschrägten Tabletten verwendet. Es wurden verschiedene Tablettierparameter untersucht, darunter Vorkompressionsdruck, Tablettendicke bei der Vorkompression, Tablettendicke bei der Hauptkompression und Drehzahl des Rotors.</h2><p>&nbsp;</p><p>Hauptkompressionsdruck, Verweilzeit und Verdrängungswerte wurden für jede produzierte Tablettencharge aufgezeichnet. Chargen mit weniger als 10% Tablettenkappenbildung nach der Kompression wurden anschließend gemäß den USP-Pharmakopöe-Methoden für Tablettendicke (Digimatic Micrometer, Mitotuyo, Japan), Bruchfestigkeit (HT1, Sotax, Schweiz) und Friabilität (TA20, Erweka, Deutschland) weiter charakterisiert. Die Anzahl der nach dem Friabilitätstest gekappten Tabletten wurde ebenfalls erfasst.</p><p>&nbsp;</p><h2>Ergebnisse und Diskussion<br />Die Herstellung von Tabletten aus Granulat erfordert die Anwendung eines bestimmten Maßes an Kompressionskraft oder Druck. Unzureichender Kompressionsdruck führt dazu, dass sich die Granulate nicht zu kohärenten Massen oder Tabletten verdichten, die einer weiteren Handhabung oder Verarbeitung standhalten können. Übermäßiger Kompressionsdruck kann jedoch zu Tablettenkappenbildung oder zu übermäßig harten Tabletten führen, die unangemessen lange Zerfallszeiten aufweisen. Für die Acetaminophen-Stärke-Formulierung wurde festgestellt, dass für die Tablettenherstellung ein Hauptkompressionsdruck im Bereich von 108–140 N/mm2 erforderlich war. Tabletten, die mit einem Hauptkompressionsdruck von mehr als 140 N/mm2 hergestellt wurden, zeigten unmittelbar nach der Kompression Kappenbildung. Im Gegensatz dazu führte die Verwendung eines niedrigen Hauptkompressionsdrucks (&lt;100 N/mm2) zu Tabletten mit sehr geringer Bruchfestigkeit (&lt;25 N).</h2><p>&nbsp;</p><p>Für jeden ausgewählten Hauptkompressionsdruck innerhalb des Bereichs von 108–140 N/mm2 nahm die Bruchfestigkeit der Tabletten zu, während die Friabilität und das Auftreten von Tablettenkappenbildung mit zunehmendem Vorkompressionsdruck abnahmen. Bei einer Vorkompressionsdruckgrenze von 34 N/mm2 und einem Hauptkompressionsdruck von 108 N/mm2 konnte die Verweilzeit durch Anpassung der Tablettendicke bei der Vorkompression und der Rotorgeschwindigkeit verändert werden. Der Luftkompensator an der Vorkompressionswalze bewegte die Walze nach oben, wenn die Vorkompressionskraft die voreingestellte Grenzkraft überschritt, und hielt so den Vorkompressionsdruck auf die Tablette konstant, während sich die Verweilzeit entsprechend verlängerte.</p><p>&nbsp;</p><p>Durch die Verlängerung der Verweilzeit in der Vorkompressionsstufe wurde festgestellt, dass die Bruchfestigkeit der Tabletten zunahm und die Friabilität abnahm. Für Acetaminophen wurden plastische Deformation und spröde Fragmentierung als Verformungsmechanismen beschrieben.1,2 Eine Verlängerung der Verweilzeit erhöhte die effektive Kontaktzeit, während der das Kompakt einer angelegten Kraft ausgesetzt war, die Kappenbildung verursachen konnte, wodurch eine weitere plastische Deformation ermöglicht wurde. Dies führte zu längeren Bindungszeiten zwischen den Partikeln. Die anschließende Anwendung des Hauptkompressionsdrucks verstärkte die Wechselwirkung weiter und verbesserte die mechanische Festigkeit der resultierenden Tabletten.</p><p>&nbsp;</p><p>Ohne einen geeigneten Eingriff in der Vorkompressionsstufe, der eine anfängliche Konsolidierung der Tablette ermöglicht, kann die Anwendung eines hohen Hauptkompressionsdrucks jedoch eine mögliche, mit elastischer Rückfederung verbundene Ruptur der gebildeten Bindungen verursachen. Dadurch entstehen geschwächte Bereiche in den Tabletten, die sie anfällig für Tablettenkappenbildung machen.</p></div>
