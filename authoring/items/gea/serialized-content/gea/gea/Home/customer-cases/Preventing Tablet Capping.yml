        <div class="ck-content"><h1>L’importance de la pression de pré-compression et du temps de séjour pour limiter les problèmes de <span style="color:hsl(240, 75%, 60%);"><strong>capsulage des comprimés</strong></span>.</h1><h2><br />Résoudre les problèmes de <span style="color:hsl(240, 75%, 60%);"><strong>capsulage des comprimés</strong></span><br />Le capsulage est un terme utilisé pour décrire le détachement d’un fragment de section transversale de la face du comprimé, qui se produit généralement juste après l’éjection du comprimé hors de la matrice. Les dommages causés aux comprimés par le capsulage entraînent invariablement le rejet du lot de production. Pour un produit enregistré, modifier la formulation n’est pas l’option privilégiée pour résoudre de tels problèmes. De plus, pour un produit fortement dosé, les possibilités de modification de la formulation sont limitées et la solution finale peut ne pas résoudre complètement le problème de capsulage.</h2><p>&nbsp;</p><p>Une alternative possible pour atténuer le capsulage consiste à utiliser une presse rotative à comprimés spécialement conçue, qui emploie un compensateur pneumatique à l’étape de pré-compression : la force de pré-compression, associée à un temps de séjour prolongé, peut être modifiée avant l’étape de compression principale. Ce nouveau mode d’application de la force de pré-compression a été étudié à l’aide d’une presse rotative à comprimés GEA avec compensateur pneumatique sur des granulés préparés par granulation à haut cisaillement ; la formulation comprenait 78% d’acétaminophène (p/p) et 22% d’amidon (p/p). Il a été constaté que la modification du mode d’application de la force de compression permettait de réduire, voire d’éliminer, l’apparition du capsulage des comprimés sans compromettre la résistance mécanique des comprimés produits.</p><p>&nbsp;</p><h2>Méthodes<br />Des granulés d’acétaminophène-amidon ont été mélangés à sec avec 1.1% de stéarate de magnésium (p/p) et 0.16% de dioxyde de silicium colloïdal (p/p). Une presse à comprimés GEA (R190FT) avec des poinçons de 10 mm a été utilisée pour préparer des comprimés plats biseautés de 325 mg. Divers paramètres de compression ont été étudiés, notamment la pression de pré-compression, l’épaisseur du comprimé en pré-compression, l’épaisseur du comprimé en compression principale et la vitesse de rotation du touret.</h2><p>&nbsp;</p><p>Les valeurs de pression de compression principale, de temps de séjour et de déplacement ont été enregistrées pour chaque lot de comprimés produit. Les lots présentant moins de 10% de capsulage des comprimés après compression ont ensuite été caractérisés selon les méthodes de la Pharmacopée USP pour l’épaisseur des comprimés (Digimatic Micrometer, Mitotuyo, Japon), la résistance à l’écrasement (HT1, Sotax, Suisse) et la friabilité (TA20, Erweka, Allemagne). Le nombre de comprimés capsulés après l’essai de friabilité a également été enregistré.</p><p>&nbsp;</p><h2>Résultats et discussion<br />La production de comprimés à partir de granulés nécessite l’application d’une certaine force ou pression de compression. Une pression de compression insuffisante empêchera les granulés de se consolider en masses cohérentes ou en comprimés pouvant résister à une manipulation ou à un traitement ultérieur. Cependant, une pression de compression excessive peut entraîner un capsulage ou des comprimés excessivement durs présentant des temps de désintégration indûment prolongés. Pour la formulation acétaminophène-amidon, il a été constaté que la production des comprimés nécessitait une pression de compression principale comprise entre 108–140 N/mm2. Les comprimés produits avec une pression de compression principale supérieure à 140 N/mm2 présentaient un capsulage immédiatement après compression. En revanche, l’utilisation d’une faible pression de compression principale (&lt;100 N/mm2) produisait des comprimés ayant une très faible résistance à l’écrasement (&lt;25 N).</h2><p>&nbsp;</p><p>Pour chaque pression de compression principale sélectionnée dans la plage de 108–140 N/mm2, la résistance à l’écrasement des comprimés augmentait tandis que la friabilité et l’apparition du capsulage diminuaient avec l’augmentation de la pression de pré-compression. En utilisant une limite de pression de pré-compression de 34 N/mm2 et une pression de compression principale de 108 N/mm2, le temps de séjour pouvait être modifié en ajustant l’épaisseur du comprimé en pré-compression et la vitesse de rotation du touret. Le compensateur pneumatique au niveau du rouleau de pré-compression déplaçait le rouleau vers le haut si la force de pré-compression dépassait la force limite préréglée, maintenant ainsi la pression de pré-compression sur le comprimé constante tandis que le temps de séjour augmentait en conséquence.</p><p>&nbsp;</p><p>En augmentant le temps de séjour à l’étape de pré-compression, il a été constaté que la résistance à l’écrasement des comprimés augmentait et que la friabilité diminuait. La déformation plastique et la fragmentation fragile ont été rapportées comme mécanismes de déformation de l’acétaminophène.1,2 Une augmentation du temps de séjour prolongeait le temps de contact effectif pendant lequel le compact était soumis à une force appliquée susceptible de provoquer le capsulage, ce qui permettait une déformation plastique supplémentaire. Il en résultait une augmentation du temps de liaison entre les particules. L’application ultérieure de la pression de compression principale renforçait encore l’interaction et améliorait la résistance mécanique des comprimés obtenus.</p><p>&nbsp;</p><p>Cependant, sans intervention appropriée à l’étape de pré-compression pour permettre une consolidation initiale du comprimé, l’application d’une pression de compression principale élevée pourrait provoquer une rupture des liaisons formées liée à une possible récupération élastique, créant ainsi des zones fragilisées dans les comprimés et les prédisposant au capsulage.</p></div>
