        <div class="ck-content"><h1>Znaczenie ciśnienia wstępnego prasowania i czasu przebywania w celu ograniczenia problemów z <span style="color:hsl(240, 75%, 60%);"><strong>wieczkowaniem</strong></span> tabletek.</h1><h2><br />Rozwiązywanie problemów z <span style="color:hsl(240, 75%, 60%);"><strong>wieczkowaniem</strong></span> tabletek<br />Wieczkowanie to termin używany do opisania oddzielenia fragmentu przekroju poprzecznego od powierzchni tabletki, co zwykle następuje tuż po wysunięciu tabletki z matrycy. Uszkodzenie tabletek przez wieczkowanie niezmiennie prowadzi do odrzucenia partii produkcyjnej. W przypadku zarejestrowanego produktu zmiana formulacji nie jest preferowaną opcją rozwiązania takich problemów. Ponadto w przypadku produktu wysokodawkowego istnieją ograniczenia dotyczące zmian formulacji i ostateczne rozwiązanie może nie wyeliminować w pełni problemu wieczkowania.</h2><p>&nbsp;</p><p>Możliwą alternatywą ograniczenia wieczkowania jest zastosowanie specjalnie zaprojektowanej rotacyjnej prasy tabletkowej, która wykorzystuje kompensator powietrzny na etapie wstępnego prasowania: siła wstępnego prasowania, w połączeniu z wydłużonym czasem przebywania, może być modyfikowana przed głównym etapem prasowania. Ten nowatorski sposób przykładania siły wstępnego prasowania zbadano z użyciem rotacyjnej prasy tabletkowej GEA z kompensatorem powietrznym na granulkach przygotowanych metodą granulacji szybkoobrotowej; formulacja składała się z 78% acetaminofenu (w/w) i 22% skrobi (w/w). Stwierdzono, że modyfikacja sposobu przykładania siły prasowania może ograniczyć, a nawet wyeliminować występowanie wieczkowania tabletek bez pogorszenia wytrzymałości mechanicznej wytworzonych tabletek.</p><p>&nbsp;</p><h2>Metody<br />Granulki acetaminofenu i skrobi mieszano na sucho z 1.1% stearynianu magnezu (w/w) oraz 0.16% koloidalnego ditlenku krzemu (w/w). Do przygotowania płaskich tabletek ze ściętymi krawędziami o masie 325 mg użyto prasy tabletkowej GEA (R190FT) z tłocznikami 10 mm. Badano różne parametry tabletkowania, w tym ciśnienie wstępnego prasowania, grubość tabletki po wstępnym prasowaniu, grubość tabletki po głównym prasowaniu oraz prędkość wieży.</h2><p>&nbsp;</p><p>Dla każdej wyprodukowanej partii tabletek rejestrowano wartości ciśnienia głównego prasowania, czasu przebywania i przemieszczenia. Partie z mniej niż 10% wieczkowania tabletek po prasowaniu poddano następnie dalszej charakterystyce zgodnie z metodami Farmakopei USP dla grubości tabletek (Digimatic Micrometer, Mitotuyo, Japonia), wytrzymałości na zgniatanie (HT1, Sotax, Szwajcaria) oraz ścieralności (TA20, Erweka, Niemcy). Rejestrowano również liczbę tabletek z wieczkowaniem po teście ścieralności.</p><p>&nbsp;</p><h2>Wyniki i omówienie<br />Wytwarzanie tabletek z granulek wymaga przyłożenia określonej siły lub ciśnienia prasowania. Niewystarczające ciśnienie prasowania spowoduje, że granulki nie skonsolidują się w zwarte masy lub tabletki zdolne wytrzymać dalsze przenoszenie lub przetwarzanie. Jednak nadmierne ciśnienie prasowania może powodować wieczkowanie lub nadmiernie twarde tabletki, które będą wykazywać niepożądanie wydłużony czas rozpadu. W przypadku formulacji acetaminofen-skrobia stwierdzono, że wytwarzanie tabletek wymagało, aby główne ciśnienie prasowania mieściło się w zakresie 108–140 N/mm2. Tabletki wytworzone przy głównym ciśnieniu prasowania wyższym niż 140 N/mm2 ulegały wieczkowaniu natychmiast po prasowaniu. Natomiast zastosowanie niskiego głównego ciśnienia prasowania (&lt;100 N/mm2) dawało tabletki o bardzo niskiej wytrzymałości na zgniatanie (&lt;25 N).</h2><p>&nbsp;</p><p>Dla każdego wybranego głównego ciśnienia prasowania w zakresie 108–140 N/mm2 wytrzymałość tabletek na zgniatanie wzrastała, natomiast ścieralność tabletek i występowanie wieczkowania malały wraz ze wzrostem ciśnienia wstępnego prasowania. Przy zastosowaniu granicznego ciśnienia wstępnego prasowania 34 N/mm2 i głównego ciśnienia prasowania 108 N/mm2 czas przebywania można było zmieniać przez regulację grubości tabletki po wstępnym prasowaniu i prędkości wieży. Kompensator powietrzny przy rolce wstępnego prasowania przesuwał rolkę ku górze, jeśli siła wstępnego prasowania przekraczała ustawioną wcześniej siłę graniczną, utrzymując tym samym stałe ciśnienie wstępnego prasowania na tabletce, podczas gdy czas przebywania odpowiednio się wydłużał.</p><p>&nbsp;</p><p>Stwierdzono, że przez wydłużenie czasu przebywania na etapie wstępnego prasowania wzrasta wytrzymałość tabletek na zgniatanie, a ścieralność maleje. Odkształcenie plastyczne i krucha fragmentacja były opisywane jako mechanizmy odkształcania acetaminofenu.1,2 Wydłużenie czasu przebywania zwiększało efektywny czas kontaktu, przez który kompakt był poddawany przyłożonej sile zdolnej powodować wieczkowanie, co umożliwiało dalsze odkształcenie plastyczne. Skutkowało to wydłużeniem czasu wiązania cząstka-cząstka. Kolejne przyłożenie głównego ciśnienia prasowania dodatkowo wzmacniało oddziaływania i poprawiało wytrzymałość mechaniczną otrzymanych tabletek.</p><p>&nbsp;</p><p>Jednak bez odpowiedniej interwencji na etapie wstępnego prasowania, pozwalającej na początkową konsolidację tabletki, zastosowanie wysokiego głównego ciśnienia prasowania mogłoby spowodować możliwe pękanie utworzonych wiązań związane ze sprężystym odkształceniem powrotnym, tworząc w ten sposób osłabione obszary w tabletkach i predysponując je do wieczkowania.</p></div>
