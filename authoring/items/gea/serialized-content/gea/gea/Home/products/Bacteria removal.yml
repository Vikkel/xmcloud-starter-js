    - ID: "2aff0fb3-0a86-4843-8ef0-de61f5cd97b4"
      Hint: Content
      Value: |
        <div class="ck-content"><p>El espectro de aplicación abarca la separación de bacterias de 1 etapa, 2 etapas y especial, desde la leche de consumo hasta la separación variable de bacterias para leche destinada a la elaboración de queso, e incluso el tratamiento de concentrado de suero.<br />&nbsp;</p><h2>Mayor rendimiento de proteínas con GEA proplus</h2><p>Opcionalmente, los separadores para eliminación de bacterias pueden equiparse con el sistema GEA proplus. Con proplus es posible ampliar los intervalos de descarga durante la producción hasta seis veces en comparación con los separadores convencionales para eliminación de bacterias. El resultado es un aumento significativo del rendimiento de proteínas de la leche cruda utilizada mediante una minimización constante de pérdidas de hasta el 75 %. Además, se reducen los costos de aguas residuales, mantenimiento y desgaste.</p><p>&nbsp;</p><h2>Diseño óptimo para la eliminación eficiente de formadores de esporas<br />El separador para eliminación de bacterias separa en particular los formadores de esporas como Bacillus cereus, resistente al calor hasta 128 °C y tolerante al frío al mismo tiempo, que afectan negativamente a la vida útil de la leche de consumo debido a la coagulación dulce. Asimismo, un gran número de defectos del queso puede prevenirse de forma eficaz mediante la aplicación de separadores para eliminación de bacterias.</h2><p>&nbsp;</p><p>El uso de nitrato también es en gran medida superfluo o puede evitarse por completo. Debido a la mayor densidad específica de las esporas en comparación con la leche cruda y la leche desnatada, pueden eliminarse de la leche con una eficacia extrema con ayuda de centrífugas para eliminación de bacterias. El diseño de la centrífuga —en particular la alimentación, la pila de discos y la bomba centrípeta— está configurado de forma óptima para esta tarea. Además, cada separador para eliminación de bacterias de GEA está equipado con un denominado sistema de recirculación. Hasta el 3% del volumen de alimentación se desvía como líquido portador y se recircula de nuevo a la alimentación. De este modo, las esporas pueden reducirse hasta en un 99%.</p><p>&nbsp;</p><h2>Toma de muestras<br />En los clarificadores, la leche cruda se separa en la fase pesada, “lodo”, y la fase ligera, “leche clarificada”. Inmediatamente después de que la fase ligera salga del clarificador, debe tomarse una muestra para evitar cualquier recontaminación. La muestra debe enfriarse a una temperatura &lt; 3 ˚C utilizando agua helada o hielo seco. Esta temperatura no debe superarse hasta que las muestras se analicen en un plazo máximo de 24 horas. Para obtener información detallada sobre el procedimiento de toma de muestras, póngase en contacto con nosotros.</h2></div>
