        <div class="ck-content"><h1>Het belang van voordruk en verblijftijd om problemen met <span style="color:hsl(240, 75%, 60%);"><strong>capping</strong></span> te beperken.</h1><h2><br />Problemen met <span style="color:hsl(240, 75%, 60%);"><strong>capping</strong></span> oplossen<br />Capping is een term die wordt gebruikt om het loskomen van een dwarsdoorsnedefragment van het tabletoppervlak te beschrijven, wat meestal direct na het uitwerpen van de tablet uit de matrijs optreedt. Beschadiging van tabletten door capping leidt onvermijdelijk tot afkeuring van de productiebatch. Voor een geregistreerd product heeft het wijzigen van de formulering niet de voorkeur om dergelijke problemen op te lossen. Bovendien zijn er voor een hooggedoseerd product grenzen aan formuleringswijzigingen en is het mogelijk dat de uiteindelijke oplossing het cappingprobleem niet volledig verhelpt.</h2><p>&nbsp;</p><p>Een mogelijk alternatief om capping te verminderen is het gebruik van een speciaal ontworpen roterende tablettenpers die in de voordrukfase een luchtcompensator toepast: de voordrukkracht kan in combinatie met een verlengde verblijftijd vóór de hoofdcompressie worden aangepast. Deze nieuwe manier van het toepassen van voordrukkracht werd onderzocht met een GEA roterende tablettenpers met luchtcompensator op granulaat bereid via high shear-granulatie; de formulering bestond uit 78% acetaminofen (w/w) en 22% zetmeel (w/w). Er werd vastgesteld dat wijziging van de manier waarop de drukkracht werd toegepast de kans op capping kon verkleinen of zelfs elimineren, zonder de mechanische sterkte van de geproduceerde tabletten in gevaar te brengen.</p><p>&nbsp;</p><h2>Methoden<br />Acetaminofen-zetmeelgranulaat werd droog gemengd met 1.1% magnesiumstearaat (w/w) en 0.16% colloïdaal siliciumdioxide (w/w). Een GEA tablettenpers (R190FT) met 10 mm ponsen werd gebruikt om vlakke tabletten van 325 mg met afgeschuinde rand te produceren. Verschillende tabletteerparameters werden onderzocht, waaronder voordruk, tabletdikte bij voordruk, tabletdikte bij hoofdcompressie en revolversnelheid.</h2><p>&nbsp;</p><p>De waarden voor hoofdcompressiedruk, verblijftijd en verplaatsing werden voor elke geproduceerde batch tabletten vastgelegd. Batches met minder dan 10% capping na compressie werden verder gekarakteriseerd volgens de USP Pharmacopoeia-methoden voor tabletdikte (Digimatic Micrometer, Mitotuyo, Japan), breuksterkte (HT1, Sotax, Zwitserland) en brosheid (TA20, Erweka, Duitsland). Het aantal tabletten met capping na de brosheidstest werd ook geregistreerd.</p><p>&nbsp;</p><h2>Resultaten en discussie<br />Voor de productie van tabletten uit granulaat moet een bepaalde hoeveelheid drukkracht of druk worden toegepast. Onvoldoende compressiedruk leidt ertoe dat het granulaat niet consolideert tot coherente massa's of tabletten die verdere hantering of verwerking kunnen weerstaan. Overmatige compressiedruk kan echter leiden tot capping of tot te harde tabletten met onnodig lange desintegratietijden. Voor de acetaminofen-zetmeelformulering werd vastgesteld dat voor tabletproductie een hoofdcompressiedruk in het bereik van 108–140 N/mm2 nodig was. Tabletten die werden geproduceerd met een hoofdcompressiedruk hoger dan 140 N/mm2 vertoonden direct na compressie capping. Daarentegen leverde het gebruik van een lage hoofdcompressiedruk (&lt;100 N/mm2) tabletten op met een zeer lage breuksterkte (&lt;25 N).</h2><p>&nbsp;</p><p>Voor elke geselecteerde hoofdcompressiedruk binnen het bereik van 108–140 N/mm2 nam de breuksterkte van de tabletten toe, terwijl de brosheid en het optreden van capping afnamen bij een hogere voordruk. Met een voordruklimiet van 34 N/mm2 en een hoofdcompressiedruk van 108 N/mm2 kon de verblijftijd worden aangepast door de tabletdikte bij voordruk en de revolversnelheid te wijzigen. De luchtcompensator bij de voordrukrol bewoog de rol omhoog als de voordrukkracht de vooraf ingestelde limiet overschreed, waardoor de voordruk op de tablet constant bleef terwijl de verblijftijd overeenkomstig toenam.</p><p>&nbsp;</p><p>Door de verblijftijd in de voordrukfase te verlengen, nam de breuksterkte van de tabletten toe en nam de brosheid af. Plastische vervorming en brosse fragmentatie zijn gerapporteerd als vervormingsmechanismen voor acetaminofen.1,2 Een langere verblijftijd verlengde de effectieve contacttijd waarin de compact aan een aangelegde kracht werd blootgesteld die capping kon veroorzaken, waardoor verdere plastische vervorming mogelijk werd. Dit resulteerde in langere deeltjes-deeltjesbindingstijden. De daaropvolgende toepassing van de hoofdcompressiedruk versterkte de interactie verder en verbeterde de mechanische sterkte van de resulterende tabletten.</p><p>&nbsp;</p><p>Zonder de juiste interventie in de voordrukfase om initiële tabletconsolidatie mogelijk te maken, kan de toepassing van een hoge hoofdcompressiedruk echter een mogelijke breuk van gevormde bindingen veroorzaken die verband houdt met elastisch herstel, waardoor verzwakte zones in de tabletten ontstaan en deze vatbaarder worden voor capping.</p></div>
