        <div class="ck-content"><h1>Die Bedeutung von Vorkompressionsdruck und Verweilzeit zur Minderung von <span style="color:hsl(240, 75%, 60%);"><strong>Deckeln</strong></span> bei Tabletten.</h1><h2><br />Lösung von Problemen mit <span style="color:hsl(240, 75%, 60%);"><strong>Deckeln</strong></span><br />Capping ist ein Begriff für das Ablösen eines querschnittlichen Fragments von der Tablettenoberfläche, was in der Regel unmittelbar nach dem Ausstoßen der Tablette aus der Matrize auftritt. Die Beschädigung von Tabletten durch Capping führt ausnahmslos zur Zurückweisung der Produktionscharge. Bei einem zugelassenen Produkt ist eine Änderung der Formulierung nicht die bevorzugte Option zur Lösung solcher Probleme. Darüber hinaus gibt es bei einem hochdosierten Produkt Grenzen für Formulierungsänderungen, und die endgültige Lösung behebt das Capping-Problem möglicherweise nicht vollständig.</h2><p>&nbsp;</p><p>Eine mögliche Alternative zur Verbesserung von Capping ist der Einsatz einer speziell entwickelten Rundlauf-Tablettenpresse, die in der Vorkompressionsstufe einen Luftkompensator verwendet: Die Vorkompressionskraft kann in Verbindung mit einer verlängerten Verweilzeit vor dem eigentlichen Hauptkompressionsereignis verändert werden. Diese neuartige Art der Anwendung der Vorkompressionskraft wurde mit einer GEA Rundlauf-Tablettenpresse mit Luftkompensator an Granulat untersucht, das durch High-Shear-Granulation hergestellt wurde; die Formulierung bestand aus 78% Acetaminophen (w/w) und 22% Stärke (w/w). Es wurde festgestellt, dass die Veränderung der Art der Anwendung der Kompressionskraft das Auftreten von Tabletten-Capping reduzieren oder sogar beseitigen kann, ohne die mechanische Festigkeit der hergestellten Tabletten zu beeinträchtigen.</p><p>&nbsp;</p><h2>Methoden<br />Acetaminophen-Stärke-Granulat wurde trocken mit 1.1% Magnesiumstearat (w/w) und 0.16% kolloidalem Siliciumdioxid (w/w) gemischt. Zur Herstellung von 325 mg schweren, flachen, abgeschrägten Tabletten wurde eine GEA Tablettenpresse (R190FT) mit 10 mm Stempeln verwendet. Untersucht wurden verschiedene Tablettierparameter, darunter Vorkompressionsdruck, Vorkompressions-Tablettendicke, Hauptkompressions-Tablettendicke und Revolvergeschwindigkeit.</h2><p>&nbsp;</p><p>Für jede produzierte Tablettencharge wurden Hauptkompressionsdruck, Verweilzeit und Wegwerte aufgezeichnet. Chargen mit weniger als 10% Capping nach der Kompression wurden anschließend gemäß den USP-Pharmakopöe-Methoden für Tablettendicke (Digimatic Micrometer, Mitotuyo, Japan), Bruchfestigkeit (HT1, Sotax, Schweiz) und Friabilität (TA20, Erweka, Deutschland) weiter charakterisiert. Die Anzahl der nach dem Friabilitätstest gedeckelten Tabletten wurde ebenfalls erfasst.</p><p>&nbsp;</p><h2>Ergebnisse und Diskussion<br />Die Herstellung von Tabletten aus Granulat erfordert die Anwendung einer bestimmten Kompressionskraft bzw. eines bestimmten Drucks. Unzureichender Kompressionsdruck führt dazu, dass sich die Granulate nicht zu kohärenten Massen oder Tabletten verdichten, die weiterer Handhabung oder Verarbeitung standhalten können. Übermäßiger Kompressionsdruck kann jedoch zu Capping oder zu übermäßig harten Tabletten führen, die ungewöhnlich lange Zerfallszeiten aufweisen würden. Für die Acetaminophen-Stärke-Formulierung wurde festgestellt, dass für die Tablettenherstellung ein Hauptkompressionsdruck im Bereich von 108–140 N/mm2 erforderlich war. Tabletten, die mit einem Hauptkompressionsdruck von mehr als 140 N/mm2 hergestellt wurden, deckelten unmittelbar nach der Kompression. Im Gegensatz dazu ergab die Verwendung eines niedrigen Hauptkompressionsdrucks (&lt;100 N/mm2) Tabletten mit sehr geringer Bruchfestigkeit (&lt;25 N).</h2><p>&nbsp;</p><p>Für jeden ausgewählten Hauptkompressionsdruck innerhalb des Bereichs von 108–140 N/mm2 stieg die Tabletten-Bruchfestigkeit, während die Friabilität und das Auftreten von Capping mit zunehmendem Vorkompressionsdruck abnahmen. Bei Verwendung eines Gren