        <div class="ck-content"><h1>Die Bedeutung von Vorkompressionsdruck und Verweilzeit zur Verringerung von <span style="color:hsl(240, 75%, 60%);"><strong>Tablet Capping</strong></span>-Problemen.</h1><h2><br />Lösung von <span style="color:hsl(240, 75%, 60%);"><strong>Tablet Capping</strong></span>-Problemen<br />Capping ist ein Begriff zur Beschreibung der Ablösung eines Querschnittsfragments von der Tablettenoberfläche, die in der Regel direkt nach dem Auswurf der Tablette aus der Matrize auftritt. Die Beschädigung von Tabletten durch Capping führt ausnahmslos zur Zurückweisung der Produktionscharge. Bei einem zugelassenen Produkt ist eine Änderung der Formulierung nicht die bevorzugte Option zur Behebung solcher Probleme. Außerdem sind bei einem hochdosierten Produkt den Formulierungsänderungen Grenzen gesetzt, und die endgültige Lösung beseitigt das Capping-Problem möglicherweise nicht vollständig.</h2><p>&nbsp;</p><p>Eine mögliche Alternative zur Verringerung von Capping besteht in der Verwendung einer speziell entwickelten Rundläufer-Tablettenpresse, die in der Vorkompressionsstufe einen Luftkompensator einsetzt: Die Vorkompressionskraft kann in Verbindung mit einer verlängerten Verweilzeit vor dem eigentlichen Hauptkompressionsvorgang angepasst werden. Dieser neuartige Modus der Anwendung der Vorkompressionskraft wurde mit einer GEA Rundläufer-Tablettenpresse mit Luftkompensator an Granulat untersucht, das durch High-Shear-Granulation hergestellt wurde; die Formulierung bestand aus 78% Acetaminophen (w/w) und 22% Stärke (w/w). Es wurde festgestellt, dass die Änderung des Modus der Anwendung der Kompressionskraft das Auftreten von Tablet Capping reduzieren oder sogar beseitigen kann, ohne die mechanische Festigkeit der hergestellten Tabletten zu beeinträchtigen.</p><p>&nbsp;</p><h2>Methoden<br />Acetaminophen-Stärke-Granulat wurde trocken mit 1.1% Magnesiumstearat (w/w) und 0.16% kolloidalem Siliciumdioxid (w/w) vermischt. Zur Herstellung von 325 mg schweren flachen Tabletten mit Facette wurde eine GEA Tablettenpresse (R190FT) mit 10 mm Stempeln verwendet. Untersucht wurden verschiedene Tablettierparameter, darunter Vorkompressionsdruck, Tablettendicke bei der Vorkompression, Tablettendicke bei der Hauptkompression und Tellergeschwindigkeit.</h2><p>&nbsp;</p><p>Hauptkompressionsdruck, Verweilzeit und Wegwerte wurden für jede hergestellte Tablettencharge aufgezeichnet. Chargen mit weniger als 10% Tablet Capping nach der Kompression wurden anschließend gemäß den USP-Pharmakopöe-Methoden weiter charakterisiert hinsichtlich Tablettendicke (Digimatic Micrometer, Mitotuyo, Japan), Bruchfestigkeit (HT1, Sotax, Schweiz) und Friabilität (TA20, Erweka, Deutschland). Auch die Anzahl der nach dem Friabilitätstest gedeckelten Tabletten wurde erfasst.</p><p>&nbsp;</p><h2>Ergebnisse und Diskussion<br />Die Herstellung von Tabletten aus Granulat erfordert die Anwendung einer bestimmten Kompressionskraft bzw. eines bestimmten Drucks. Ein unzureichender Kompressionsdruck führt dazu, dass sich die Granulate nicht zu kohärenten Massen oder Tabletten verdichten, die weiterer Handhabung oder Verarbeitung standhalten. Ein übermäßiger Kompressionsdruck kann jedoch zu Capping oder zu übermäßig harten Tabletten führen, die eine unzulässig lange Zerfallszeit aufweisen. Für die Acetaminophen-Stärke-Formulierung wurde festgestellt, dass für die Tablettenherstellung ein Hauptkompressionsdruck im Bereich von 108–140 N/mm2 erforderlich war. Tabletten, die mit einem Hauptkompressionsdruck von mehr als 140 N/mm2 hergestellt wurden, zeigten unmittelbar nach der Kompression Capping. Im Gegensatz dazu führte die Verwendung eines niedrigen Hauptkompressionsdrucks (&lt;100 N/mm2) zu Tabletten mit sehr geringer Bruchfestigkeit (&lt;25 N).</h2><p>&nbsp;</p><p>Für jeden ausgewählten Hauptkompressionsdruck im Bereich von 108–140 N/mm2 nahm die Tablettenbruchfestigkeit zu, während die Friabilität und das Auftreten von Capping mit steigendem Vorkompressionsdruck abnahmen. Bei einer Vorkompressionsdruckgrenze von 34 N/mm2 und einem Hauptkompressionsdruck von 108 N/mm2 konnte die Verweilzeit durch Anpassung der Tablettendicke bei der Vorkompression und der Tellergeschwindigkeit verändert werden. Der Luftkompensator an der Vorkompressionswalze bewegte die Walze nach oben, wenn die Vorkompressionskraft die voreingestellte Grenzkraft überschritt, wodurch der Vorkompressionsdruck auf der Tablette konstant blieb, während sich die Verweilzeit entsprechend verlängerte.</p><p>&nbsp;</p><p>Durch die Verlängerung der Verweilzeit in der Vorkompressionsstufe wurde festgestellt, dass die Tablettenbruchfestigkeit zunahm und die Friabilität abnahm. Für Acetaminophen wurden plastische Deformation und spröde Fragmentierung als Deformationsmechanismen beschrieben.1,2 Eine längere Verweilzeit verlängerte die effektive Kontaktzeit, in der der Kompakt einem angelegten Kraftniveau ausgesetzt war, das Capping verursachen kann, und ermöglichte dadurch eine weitere plastische Deformation. Dies führte zu längeren Partikel-Partikel-Bindungszeiten. Die anschließende Anwendung des Hauptkompressionsdrucks verstärkte die Wechselwirkung weiter und verbesserte die mechanische Festigkeit der resultierenden Tabletten.</p><p>&nbsp;</p><p>Ohne die geeignete Intervention in der Vorkompressionsstufe zur Ermöglichung einer anfänglichen Tablettenkonsolidierung könnte die Anwendung eines hohen Hauptkompressionsdrucks jedoch eine mögliche, mit elastischer Rückfederung verbundene Ruptur gebildeter Bindungen verursachen. Dadurch würden in den Tabletten geschwächte Bereiche entstehen, die sie anfälliger für Capping machen.</p></div>
