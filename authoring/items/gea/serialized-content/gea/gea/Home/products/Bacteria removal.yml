      Hint: Content
      Value: |
        <div class="ck-content"><p>Das Anwendungsspektrum reicht von 1-stufiger, 2-stufiger und spezieller Bakterienabtrennung aus Trinkmilch über variable Bakterienabtrennung bis hin zu Milch für die Käseherstellung und zur Behandlung von Molkekonzentrat.<br />&nbsp;</p><h2>Höhere Proteinausbeute mit GEA proplus</h2><p>Optional können die Bakterienentfernungsseparatoren mit dem GEA proplus System ausgestattet werden. Mit proplus ist es möglich, die Austragsintervalle während der Produktion im Vergleich zu herkömmlichen Bakterienentfernungsseparatoren um das bis zu Sechsfache zu verlängern. Das Ergebnis ist eine deutliche Steigerung der Proteinausbeute aus der eingesetzten Rohmilch durch eine konsequente Minimierung der Verluste um bis zu 75 %. Darüber hinaus sinken die Kosten für Abwasser, Wartung und Verschleiß.</p><p>&nbsp;</p><h2>Optimales Design für die effiziente Entfernung von Sporenbildnern<br />Der Bakterienentfernungsseparator trennt insbesondere Sporenbildner wie Bacillus cereus ab, hitzebeständig bis 128 °C und zugleich kältetolerant, die die Haltbarkeit der Trinkmilch durch Süßgerinnung negativ beeinflussen. Auch eine große Zahl von Käsefehlern kann durch den Einsatz von Bakterienentfernungsseparatoren wirksam verhindert werden.</h2><p>&nbsp;</p><p>Der Einsatz von Nitrat ist ebenfalls weitgehend überflüssig oder kann vollständig entfallen. Aufgrund der höheren spezifischen Dichte der Sporen im Vergleich zu Rohmilch und Magermilch können sie mit Hilfe von bakterienentfernenden Zentrifugen äußerst effizient aus der Milch entfernt werden. Das Design der Zentrifuge – insbesondere Zulauf, Tellerpaket und Zentripetalpumpe – ist für diese Aufgabe optimal ausgelegt. Zusätzlich ist jeder GEA Bakterienentfernungsseparator mit einem sogenannten Rezirkulationssystem ausgestattet. Bis zu 3 % des Zulaufvolumens werden als Trägerflüssigkeit abgezweigt und in den Zulauf zurückgeführt. Auf diese Weise können die Sporen um bis zu 99 % reduziert werden.</p><p>&nbsp;</p><h2>Probenahme<br />In den Klärern wird die Rohmilch in die Schwerphase „Schlamm“ und die Leichtphase „geklärte Milch“ getrennt. Direkt nachdem die Leichtphase den Klärer verlässt, muss eine Probe genommen werden, um eine Rekontamination zu vermeiden. Die Probe muss mit Eiswasser oder Trockeneis auf eine Temperatur von &lt; 3 ˚C gekühlt werden. Diese Temperatur darf nicht überschritten werden, bis die Proben nach spätestens 24 Stunden untersucht werden. Für ausführliche Informationen zum Verfahren der Probenahme kontaktieren Sie uns bitte.</h2></div>
