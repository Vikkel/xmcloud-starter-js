      Value: |
        <div class="ck-content"><p>GEA ofrece una gama de modelos de <span style="color:hsl(240, 75%, 60%);"><strong>cortadora de cuajada</strong></span>, diseñados conforme a las más altas especificaciones y normas de higiene. Entre las opciones se incluye la instalación de válvulas de aspersión en toda la cámara y el sistema de tuberías asociado para la conexión a una planta externa de limpieza in situ. También es posible configurar algunas unidades de ciertos modelos con sensores de seguridad que detienen automáticamente el funcionamiento si se abren los paneles de inspección de la cortadora. Y, por supuesto, todas las tecnologías de GEA están diseñadas para facilitar el servicio y se fabrican con materiales y componentes de la máxima calidad para maximizar la vida útil.</p></div>
