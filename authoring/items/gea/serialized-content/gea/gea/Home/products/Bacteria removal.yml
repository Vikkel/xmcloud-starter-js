    - ID: "2aff0fb3-0a86-4843-8ef0-de61f5cd97b4"
      Hint: Content
      Value: |
        <div class="ck-content"><p>Das Anwendungsspektrum reicht von 1-stufiger, 2-stufiger und spezieller Bakterienabtrennung von Konsummilch über variable Bakterienabtrennung bis hin zu Milch für die Käseherstellung und zur Behandlung von Molkenkonzentrat.<br />&nbsp;</p><h2>Höhere Proteinausbeute mit GEA proplus</h2><p>Optional können die Bakterienentfernungsseparatoren mit dem GEA proplus System ausgestattet werden. Mit proplus ist es möglich, die Auswurfintervalle während der Produktion im Vergleich zu herkömmlichen Bakterienentfernungsseparatoren um das bis zu Sechsfache zu verlängern. Das Ergebnis ist eine deutliche Steigerung der Proteinausbeute aus der eingesetzten Rohmilch durch eine konsequente Verlustminimierung von bis zu 75 %. Darüber hinaus sinken die Kosten für Abwasser, Wartung und Verschleiß.</p><p>&nbsp;</p><h2>Optimale Auslegung für die effiziente Entfernung von Sporenbildnern<br />Der Bakterienentfernungsseparator trennt insbesondere Sporenbildner wie Bacillus cereus ab, hitzebeständig bis zu 128 °C und zugleich kältetolerant, die durch Süßgerinnung die Haltbarkeit der Konsummilch negativ beeinflussen. Eine große Zahl von Käsefehlern kann durch den Einsatz von Bakterienentfernungsseparatoren ebenfalls wirksam verhindert werden.</h2><p>&nbsp;</p><p>Der Einsatz von Nitrat ist außerdem weitgehend überflüssig oder kann vollständig entfallen. Aufgrund der höheren spezifischen Dichte der Sporen im Vergleich zu Rohmilch und Magermilch können diese mit Hilfe von bakterienentfernenden Zentrifugen äußerst effizient aus der Milch entfernt werden. Die Auslegung der Zentrifuge – insbesondere Zulauf, Tellerpaket und Zentripetalpumpe – ist für diese Aufgabe optimal konfiguriert. Zusätzlich ist jeder GEA Bakterienentfernungsseparator mit einem sogenannten Rezirkulationssystem ausgestattet. Bis zu 3 % des Zulaufvolumens werden als Trägerflüssigkeit abgezweigt und in den Zulauf zurückgeführt. Auf diese Weise können die Sporen um bis zu 99 % reduziert werden.</p><p>&nbsp;</p><h2>Probenahme<br />In den Klärseparatoren wird die Rohmilch in die schwere Phase „Schlamm“ und die leichte Phase „geklärte Milch“ getrennt. Direkt nachdem die leichte Phase den Klärseparator verlässt, muss eine Probe genommen werden, um eine erneute Kontamination zu vermeiden. Die Probe muss mit Eiswasser oder Trockeneis auf eine Temperatur von &lt; 3 ˚C gekühlt werden. Diese Temperatur darf nicht überschritten werden, bis die Proben spätestens nach 24 Stunden untersucht werden. Für detaillierte Informationen zum Verfahren der Probenahme kontaktieren Sie uns bitte.</h2></div>
