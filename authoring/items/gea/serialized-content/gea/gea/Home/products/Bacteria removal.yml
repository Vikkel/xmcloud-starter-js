    - ID: "2aff0fb3-0a86-4843-8ef0-de61f5cd97b4"
      Hint: Content
      Value: |
        <div class="ck-content"><p>The application spectrum ranges from 1-stage, 2-stage and special bacteria separation from drinking milk through variable bacteria separation to cheese-making milk, right up to treatment of whey concentrate.<br />&nbsp;</p><h2>Increased protein yield with GEA proplus</h2><p>Optionally, the <span style="color:hsl(240, 75%, 60%);"><strong>bacteria removal separators</strong></span> can be equipped with the GEA proplus system. With proplus it is possible to extend the ejection intervals during production up to six-fold compared to conventional bacteria removal separators. The result is a significant boost in protein yield from the raw milk used by means of consistent loss minimization of up to 75 %. In addition, there is a decrease in costs for waste water, maintenance and wear.</p><p>&nbsp;</p><h2>Optimum design for the efficient removal of spore formers<br />The bacteria removal separator separates in particular spore formers such as Bacillus cereus, heat-resistant up to 128 °C and cold-tolerant at the same time, which negatively impact the shelf life of the drinking milk due to sweet coagulation. A large number of cheese defects can likewise be prevented effectively through the application of bacteria removal separators.</h2><p>&nbsp;</p><p>The use of nitrate is also largely superfluous or can be dispensed with completely. Due to the higher specific gravity of the spores compared to the raw milk and skim milk, they can be removed from the milk extremely efficiently with the aid of bacteria-removing centrifuges. The design of the centrifuge – the feed, disk stack and centripetal pump in particular – is configured optimally for this task. Additionally, every GEA bacteria removal separator is equipped with a so-called recirculation system. Up to 3% of the feed volume is tapped off as carrier liquid and recycled back into the feed. In this way, the spores can be reduced by up to 99%.</p><p>&nbsp;</p><h2>Taking samples<br />In the clarifiers the raw milk is separated in to the heavy phase “sludge” and the light phase “clarified milk”. Directly after the light phase leaves the clarifier, a sample has to be taken in order to avoid any recontamination. The sample must be cooled to a temperature &lt; 3 ˚C using iced water or dry ice. This temperature may not be exceeded until the samples are examined after no more than 24 hours. For detailed information about the sample taking procedure please contact us.</h2></div>
