        <div class="ck-content"><p>GEA propose une gamme de modèles de <span style="color:hsl(240, 75%, 60%);"><strong>tranche-caillé</strong></span>, conçus selon les spécifications les plus élevées et les normes d’hygiène les plus strictes. Les options incluent l’installation de vannes d’aspersion dans toute la chambre et de la tuyauterie associée pour le raccordement à une installation externe de nettoyage en place. Il est également possible de configurer certaines unités de modèles avec des capteurs de sécurité qui arrêtent automatiquement le fonctionnement si les panneaux d’inspection du tranche-caillé sont ouverts. Et bien sûr, toutes les technologies GEA sont conçues pour être faciles à entretenir et sont fabriquées avec des matériaux et des composants de la plus haute qualité afin de maximiser leur durée de vie.</p></div>
