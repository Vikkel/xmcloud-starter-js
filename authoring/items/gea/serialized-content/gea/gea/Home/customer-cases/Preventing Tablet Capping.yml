        <div class="ck-content"><h1>L'importanza della pressione di pre-compressione e del tempo di permanenza per mitigare i problemi di <span style="color:hsl(240, 75%, 60%);"><strong>tablet capping</strong></span>.</h1><h2><br />Risolvere i problemi di <span style="color:hsl(240, 75%, 60%);"><strong>tablet capping</strong></span><br />Il capping è un termine usato per descrivere il distacco di un frammento trasversale dalla faccia della compressa, che di solito si verifica subito dopo l'espulsione della compressa dalla matrice. Il danno alle compresse causato dal capping porterà inevitabilmente al rigetto del lotto di produzione. Per un prodotto registrato, modificare la formulazione non è l'opzione preferita per risolvere tali problemi. Inoltre, per un prodotto ad alto dosaggio, vi sono limiti alle modifiche della formulazione e la soluzione finale potrebbe non risolvere completamente il problema di tablet capping.</h2><p>&nbsp;</p><p>Una possibile alternativa per migliorare il capping consiste nell'utilizzare una comprimitrice rotativa appositamente progettata che impiega un compensatore ad aria nella fase di pre-compressione: la forza di pre-compressione, insieme a un tempo di permanenza prolungato, può essere modificata prima dell'evento di compressione principale. Questa nuova modalità di applicazione della forza di pre-compressione è stata studiata utilizzando una comprimitrice rotativa GEA con compensatore ad aria su granuli preparati mediante granulazione ad alto taglio; la formulazione comprendeva il 78% di acetaminofene (p/p) e il 22% di amido (p/p). Si è riscontrato che la modifica della modalità di applicazione della forza di compressione era in grado di ridurre o persino eliminare l'insorgenza di tablet capping senza compromettere la resistenza meccanica delle compresse prodotte.</p><p>&nbsp;</p><h2>Metodi<br />Granuli di acetaminofene-amido sono stati miscelati a secco con 1.1% di stearato di magnesio (p/p) e 0.16% di biossido di silicio colloidale (p/p). Per preparare compresse piane smussate da 325 mg è stata utilizzata una comprimitrice GEA (R190FT) con punzoni da 10 mm. Sono stati studiati vari parametri di compressione, tra cui pressione di pre-compressione, spessore della compressa in pre-compressione, spessore della compressa in compressione principale e velocità della torretta.</h2><p>&nbsp;</p><p>Per ogni lotto di compresse prodotto sono stati registrati i valori di pressione di compressione principale, tempo di permanenza e spostamento. I lotti con meno del 10% di tablet capping dopo la compressione sono stati ulteriormente caratterizzati secondo i metodi della Farmacopea USP per spessore della compressa (Digimatic Micrometer, Mitotuyo, Japan), resistenza allo schiacciamento (HT1, Sotax, Switzerland) e friabilità (TA20, Erweka, Germany). È stato inoltre registrato il numero di compresse con capping dopo il test di friabilità.</p><p>&nbsp;</p><h2>Risultati e discussione<br />La produzione di compresse a partire da granuli richiede l'applicazione di una certa quantità di forza o pressione di compressione. Una pressione di compressione insufficiente comporterà l'incapacità dei granuli di consolidarsi in masse coerenti o compresse in grado di resistere a ulteriori manipolazioni o lavorazioni. Tuttavia, una pressione di compressione eccessiva può causare capping o compresse eccessivamente dure che mostrerebbero tempi di disintegrazione indebitamente prolungati. Per la formulazione acetaminofene-amido, è stato riscontrato che la produzione di compresse richiedeva che la pressione di compressione principale fosse nell'intervallo 108–140 N/mm2. Le compresse prodotte con una pressione di compressione principale superiore a 140 N/mm2 presentavano capping immediatamente dopo la compressione. Al contrario, l'uso di una bassa pressione di compressione principale (&lt;100 N/mm2) ha prodotto compresse con resistenza allo schiacciamento molto bassa (&lt;25 N).</h2><p>&nbsp;</p><p>Per ogni pressione di compressione principale selezionata nell'intervallo 108–140 N/mm2, la resistenza allo schiacciamento della compressa aumentava mentre la friabilità della compressa e l'insorgenza di capping diminuivano con l'aumento della pressione di pre-compressione. Utilizzando un limite di pressione di pre-compressione di 34 N/mm2 e una pressione di compressione principale di 108 N/mm2, il tempo di permanenza poteva essere modificato regolando lo spessore della compressa in pre-compressione e la velocità della torretta. Il compensatore ad aria sul rullo di pre-compressione si spostava verso l'alto se la forza di pre-compressione superava la forza limite preimpostata, mantenendo così costante la pressione di pre-compressione sulla compressa mentre il tempo di permanenza aumentava di conseguenza.</p><p>&nbsp;</p><p>Aumentando il tempo di permanenza nella fase di pre-compressione, si è riscontrato un aumento della resistenza allo schiacciamento della compressa e una diminuzione della friabilità. Deformazione plastica e frammentazione fragile sono state riportate come meccanismi di deformazione per l'acetaminofene.1,2 Un aumento del tempo di permanenza ha esteso il tempo di contatto effettivo durante il quale il compatto era soggetto a una forza applicata in grado di causare capping, consentendo un'ulteriore deformazione plastica. Ciò ha comportato un aumento dei tempi di legame particella-particella. La successiva applicazione della pressione di compressione principale ha ulteriormente migliorato l'interazione e aumentato la resistenza meccanica delle compresse risultanti.</p><p>&nbsp;</p><p>Tuttavia, senza un intervento appropriato nella fase di pre-compressione per consentire il consolidamento iniziale della compressa, l'applicazione di un'elevata pressione di compressione principale potrebbe causare una possibile rottura dei legami formati correlata al recupero elastico, creando così aree indebolite nelle compresse e predisponendole al capping.</p></div>
