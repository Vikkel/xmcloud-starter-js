N).</h2><p>&nbsp;</p><p>Pour chaque pression de compression principale sélectionnée dans la plage de 108–140 N/mm2, la résistance à l’écrasement des comprimés augmentait tandis que la friabilité et l’apparition du décalottage diminuaient avec l’augmentation de la pression de précompression. En utilisant une limite de pression de précompression de 34 N/mm2 et une pression de compression principale de 108 N/mm2, le temps de séjour pouvait être modifié en ajustant l’épaisseur du comprimé en précompression et la vitesse de rotation de la tourelle. Le compensateur pneumatique au niveau du rouleau de précompression déplaçait le rouleau vers le haut si la force de précompression dépassait la force limite préréglée, maintenant ainsi la pression de précompression sur le comprimé constante tandis que le temps de séjour augmentait en conséquence.</p><p>&nbsp;</p><p>En augmentant le temps de séjour à l’étape de précompression, il a été constaté que la résistance à l’écrasement des comprimés augmentait et que la friabilité diminuait. La déformation plastique et la fragmentation fragile ont été décrites comme des mécanismes de déformation de l’acétaminophène.1,2 Une augmentation du temps de séjour prolongeait le temps de contact effectif pendant lequel le compact était soumis à une force appliquée susceptible de provoquer un décalottage, ce qui permettait une déformation plastique supplémentaire. Cela a entraîné une augmentation du temps de liaison entre les particules. L’application ultérieure de la pression de compression principale a encore renforcé l’interaction et amélioré la résistance mécanique des comprimés obtenus.</p><p>&nbsp;</p><p>Cependant, sans intervention appropriée à l’étape de précompression pour permettre une consolidation initiale du comprimé, l’application d’une pression de compression principale élevée pourrait provoquer une rupture liée à une possible récupération élastique des liaisons formées, créant ainsi des zones affaiblies dans les comprimés et les prédisposant au décalottage.</p></div>
