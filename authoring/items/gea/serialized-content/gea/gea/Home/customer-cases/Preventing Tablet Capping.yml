        <div class="ck-content"><h1>La importancia de la presión de precompresión y del tiempo de permanencia para mitigar los problemas de <span style="color:hsl(240, 75%, 60%);"><strong>decapado</strong></span> de comprimidos.</h1><h2><br />Resolución de problemas de <span style="color:hsl(240, 75%, 60%);"><strong>Decapado</strong></span> de comprimidos<br />El decapado es un término que se utiliza para describir la separación de un fragmento transversal de la cara del comprimido, que suele producirse justo después de la expulsión del comprimido de la matriz. El daño en los comprimidos por decapado conduce invariablemente al rechazo del lote de producción. En el caso de un producto registrado, cambiar la formulación no es la opción preferida para resolver estos problemas. Además, en un producto de dosis alta, existen límites a los cambios de formulación y es posible que la solución final no resuelva por completo el problema de decapado.</h2><p>&nbsp;</p><p>Una posible alternativa para mejorar el decapado es utilizar una prensa rotativa de comprimidos especialmente diseñada que emplea un compensador de aire en la etapa de precompresión: la fuerza de precompresión, junto con un tiempo de permanencia ampliado, puede modificarse antes del evento de compresión principal. Este novedoso modo de aplicación de la fuerza de precompresión se investigó utilizando una prensa rotativa de comprimidos GEA con compensador de aire sobre gránulos preparados mediante granulación de alto cizallamiento; la formulación comprendía 78% de acetaminofén (p/p) y 22% de almidón (p/p). Se observó que la modificación del modo de aplicación de la fuerza de compresión era capaz de reducir o incluso eliminar la aparición de decapado de comprimidos sin comprometer la resistencia mecánica de los comprimidos producidos.</p><p>&nbsp;</p><h2>Métodos<br />Los gránulos de acetaminofén y almidón se mezclaron en seco con 1.1% de estearato de magnesio (p/p) y 0.16% de dióxido de silicio coloidal (p/p). Se utilizó una prensa de comprimidos GEA (R190FT) con punzones de 10 mm para preparar comprimidos planos biselados de 325 mg. Se investigaron diversos parámetros de compresión, entre ellos la presión de precompresión, el grosor del comprimido en precompresión, el grosor del comprimido en compresión principal y la velocidad de la torreta.</h2><p>&nbsp;</p><p>Se registraron los valores de presión, tiempo de permanencia y desplazamiento de compresión principal para cada lote de comprimidos producido. Los lotes con menos de 10% de decapado de comprimidos después de la compresión se caracterizaron posteriormente según los métodos de la Farmacopea USP para el grosor del comprimido (Digimatic Micrometer, Mitotuyo, Japón), la resistencia al aplastamiento (HT1, Sotax, Suiza) y la friabilidad (TA20, Erweka, Alemania). También se registró el número de comprimidos decapados después de la prueba de friabilidad.</p><p>&nbsp;</p><h2>Resultados y debate<br />La producción de comprimidos a partir de gránulos requiere la aplicación de una determinada cantidad de fuerza o presión de compresión. Una presión de compresión insuficiente dará lugar a que los gránulos no se consoliden en masas coherentes o comprimidos que puedan soportar una manipulación o un procesamiento posteriores. Sin embargo, una presión de compresión excesiva puede provocar decapado o comprimidos excesivamente duros que mostrarían tiempos de desintegración indebidamente prolongados. Para la formulación de acetaminofén y almidón, se observó que la producción de comprimidos requería que la presión de compresión principal estuviera en el intervalo de 108–140 N/mm2. Los comprimidos producidos con una presión de compresión principal superior a 140 N/mm2 se decaparon inmediatamente después de la compresión. En cambio, el uso de una presión de compresión principal baja (&lt;100 N/mm2) produjo comprimidos con una resistencia al aplastamiento muy baja (&lt;25 N).</h2><p>&nbsp;</p><p>Para cada presión de compresión principal seleccionada dentro del intervalo de 108–140 N/mm2, la resistencia al aplastamiento del comprimido aumentó, mientras que la friabilidad y la aparición de decapado disminuyeron con el aumento de la presión de precompresión. Utilizando un límite de presión de precompresión de 34 N/mm2 y una presión de compresión principal de 108 N/mm2, el tiempo de permanencia podía modificarse ajustando el grosor del comprimido en precompresión y la velocidad de la torreta. El compensador de aire en el rodillo de precompresión desplazaría el rodillo hacia arriba si la fuerza de precompresión superaba la fuerza límite preestablecida, manteniendo así constante la presión de precompresión sobre el comprimido mientras el tiempo de permanencia aumentaba en consecuencia.</p><p>&nbsp;</p><p>Al aumentar el tiempo de permanencia en la etapa de precompresión, se observó que la resistencia al aplastamiento del comprimido aumentaba y la friabilidad disminuía. Se ha informado de la deformación plástica y la fragmentación frágil como mecanismos de deformación del acetaminofén.1,2 Un aumento del tiempo de permanencia prolongó el tiempo de contacto efectivo durante el cual el compacto estuvo sometido a una fuerza aplicada capaz de causar decapado, lo que permitió una mayor deformación plástica. Esto dio lugar a un aumento de los tiempos de unión partícula-partícula. La aplicación posterior de la presión de compresión principal mejoró aún más la interacción y mejoró la resistencia mecánica de los comprimidos resultantes.</p><p>&nbsp;</p><p>Sin embargo, sin la intervención adecuada en la etapa de precompresión para permitir la consolidación inicial del comprimido, la aplicación de una presión de compresión principal alta podría causar una posible rotura por recuperación elástica de los enlaces formados, creando así zonas debilitadas en los comprimidos y predisponiéndolos al decapado.</p></div>
